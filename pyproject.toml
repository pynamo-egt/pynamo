[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pynamo-egt"
version = "0.3.4"
description = "pyNamo-EGT: plotting and analysis tools for replicator dynamics in evolutionary games."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Slimane Dridi" },
    { name = "Benjamin Giraudon" },
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1.1",
    "scipy>=1.11.2",
    "sympy>=1.12",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.25",
    "ipympl>=0.9.3",
    "ipywidgets>=8.1",
    "jupyter>=1.0",
]
plotly = [
    "plotly>=5.18",
]
dev = [
    "pytest>=7.4",
]
docs = [
    "ipykernel>=6.25",
    "ipympl>=0.9.3",
    "ipywidgets>=8.1",
    "myst-nb>=1.1",
    "numpydoc>=1.8",
    "plotly>=5.18",
    "pydata-sphinx-theme>=0.16",
    "sphinx>=8",
    "sphinx-gallery>=0.17",
]

[project.urls]
Repository = "https://github.com/pynamo-egt/pynamo"
Issues = "https://github.com/pynamo-egt/pynamo/issues"

[tool.setuptools.packages.find]
include = ["pynamo_egt", "pynamo_egt.*"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "pynamo_egt/__init__.py:__version__",
    "CITATION.cff:version",
]
tag_format = "v{version}"
commit_parser = "conventional"
major_on_zero = false
allow_zero_version = true
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
